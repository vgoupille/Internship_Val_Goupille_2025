name: bioinfo_env
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.11
  - pip 
  - ipykernel=6.29.5
  - jupyterlab=4.4.1
  - pandas=2.2.3
  - matplotlib=3.10.1
  - seaborn=0.13.2
  - statsmodels=0.14.4
  - numpy=2.2.5
  - biopython=1.85
  - scanpy=1.11.2
  - scipy=1.15.4
  - anndata=0.11.4

  - pip:
    - pydeseq2==0.5.1
    - goatools==1.4.12
    - rpy2==3.6.1
