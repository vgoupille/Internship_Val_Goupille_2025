# =====================================================================================
# MicroSPLiT Single-Cell RNA-seq Experiment Configuration
# =====================================================================================
# This file documents the complete library structure and experimental protocol
# for bacterial single-cell RNA sequencing using microSPLiT technology
# =====================================================================================

experiment_info:
  # Basic experiment identifiers
  name: "microsplit_single_cell_split_pool_barcoding"
  description: "Investigating intraspecific Division of Labor in Pseudomonas brassicacearum R401 under contrasting iron conditions"
  
  # Biological context
  organism: "Pseudomonas brassicacearum R401"
  organism_type: "Gram-negative bacterium"
  ecological_niche: "Root colonizer and opportunistic plant pathogen"
  host_plant: "Arabidopsis thaliana"
  
  # Research hypothesis
  biological_hypothesis: >
    Iron-limited conditions promote functional specialization among genetically identical PsR401 cells,
    leading to subpopulations specializing in complementary metabolic tasks (toxin production, 
    antimicrobial defense, siderophore-mediated iron acquisition) to enhance population-level fitness.
  
  # Key metabolites studied
  target_exometabolites:
    - name: "Brassicapeptin"
      function: "Phytotoxin for pathogenicity and root colonization"
    - name: "DAPG"
      full_name: "2,4-diacetylphloroglucinol"
      function: "Antimicrobial against competitors"
    - name: "Pyoverdine"
      function: "Siderophore for iron chelation"
  
  # Experimental design
  experimental_design:
    total_samples: 18
    calculation: "2 media × 3 biological replicates × 3 timepoints"
    
    culture_conditions:
      M9:
        description: "Iron-limited, low glucose (stringent conditions)"
        glucose_concentration: "Low"
        iron_supplementation: "None"
        stress_level: "High (stringent)"
        growth_characteristics: "Limited growth, reaches plateau by T2"
      M9F:
        description: "Iron-replete, high glucose (permissive conditions)"  
        glucose_concentration: "20 mM"
        iron_supplementation: "100 µM FeCl3"
        stress_level: "Low (permissive)"
        growth_characteristics: "Higher growth rates, continued exponential growth"
    
    timepoints:
      T1:
        description: "Initial sampling point (identical for both conditions)"
        OD_range_M9: "0.13-0.21"
        OD_range_M9F: "0.13-0.21"
        growth_phase: "Early exponential"
      T2:
        description: "Mid-growth sampling (condition-specific timing)"
        OD_range_M9: "0.28-0.33"
        OD_range_M9F: "0.59-0.63"
        growth_phase_M9: "Approaching plateau"
        growth_phase_M9F: "Active exponential growth"
      T3:
        description: "Late sampling (condition-specific timing)"
        OD_range_M9: "0.26"
        OD_range_M9F: "0.74-0.83"
        growth_phase_M9: "Plateau phase"
        growth_phase_M9F: "Continued exponential growth"
    
    biological_replicates: 3
    replicate_labels: ["Rep A", "Rep B", "Rep C"]
    technical_replicates_per_sample: 5
    total_technical_replicates: 90
    technical_replicate_calculation: "18 samples × 5 technical replicates each"
    
  # Technology and sequencing
  technology:
    method: "microSPLiT"
    full_name: "microbial Split-Pool Ligation Transcriptomics"
    advantages: 
      - "High-throughput bacterial scRNA-seq"
      - "No specialized equipment required"
      - "Split-pool barcoding strategy"
      - "Up to 820,800 unique barcode combinations"
    
  sequencing_info:
    platform: "NovaSeq X Plus"
    facility: "GenoA platform"
    read_type: "Paired-end"
    read_structure:
      R1: "241 cycles (cDNA/biological content)"
      R2: "91 cycles (barcodes + UMI)"
      i7_index: "6 cycles"
    concentration: "200 pM"
    phix_spike: "20%"
    
    # Library indices for sequencing quality
    sequencing_libraries:
      BC_0076:
        index: "CAGATC"
        purpose: "Sequencing quality and balance"
      BC_0077:
        index: "ACTTGA"  
        purpose: "Sequencing quality and balance"
      BC_0079:
        index: "TAGCTT"
        purpose: "Sequencing quality and balance"
      BC_0080:
        index: "GGCTAC"
        purpose: "Sequencing quality and balance"
    
  # Analysis scope
  analysis_objectives:
    primary: "Validate microSPLiT technology for bacterial systems"
    secondary: "Test iron limitation hypothesis for metabolic specialization"
    approach: "Single-cell transcriptomics to detect functional heterogeneity"
    expected_outcome: "Identify subpopulations with specialized metabolic functions"

# =====================================================================================
# MICROSPLIT LIBRARY STRUCTURE
# =====================================================================================
# Complete description of the microSPLiT library construct from 5' to 3'

microsplit_library_structure:
  - name: "Illumina_P5"
    sequence: "AATGATACGGCGACCACCGAGATCTACAC"
    length: 29
    description: "Illumina P5 adapter sequence"
  - name: "spacer_after_P5"
    sequence: "TAGATCGC"
    length: 8
    description: "Short sequence following P5"
  - name: "s5"
    sequence: "TCGTCGGCAGCGTC"
    length: 14
    description: "s5 sequence"
  - name: "ME"
    sequence: "AGATGTGTATAAGAGACAG"
    length: 19
    description: "Mosaic End sequence"
  - name: "cDNA"
    sequence_type: "variable"
    description: "Complementary DNA, target sequence of interest"
  - name: "polyA_or_random_hexamer"
    description: "PolyA tail or random hexamer following cDNA"
    options:
      - type: "polyA"
        sequence_pattern: "A{15}" # Nominal length
        length: 15
        description: "Typically 15bp polyA tail"
      - type: "random_hexamer"
        sequence_pattern: "N{6}"
        length: 6
        description: "6bp random hexamer"
  - name: "barcode_R1"
    sequence_pattern: "N{8}"
    length: 8
    description: "Round 1 Barcode (8bp)"
  - name: "linker_R2" # Round 2 Linker
    sequence: "CCACAGTCTCAAGCACGTGGAT"
    length: 22
    description: "Round 2 Linker sequence"
  - name: "barcode_R2"
    sequence_pattern: "N{8}"
    length: 8
    description: "Round 2 Barcode (8bp)"
  - name: "linker_R3" # Round 3 Linker
    sequence: "AGTCGTACGCCGATGCGAAACATCGGCCAC"
    length: 30
    description: "Round 3 Linker sequence"
  - name: "barcode_R3"
    sequence_pattern: "N{8}"
    length: 8
    description: "Round 3 Barcode (8bp)"
  - name: "UMI"
    sequence_pattern: "N{10}"
    length: 10
    description: "Unique Molecular Identifier (10bp)"
  - name: "TruSeq_Read_2_adapter"
    sequence: "AGATCGGAAGAGCACACGTCTGAACTCCAGTCAC"
    length: 34
    description: "TruSeq Read 2 adapter sequence"
  - name: "index_i7"
    sequence_pattern: "N{6}"
    length: 6
    description: "i7 library index (6bp)"
  - name: "Illumina_P7"
    sequence: "ATCTCGTATGCCGTCTTCTGCTTG"
    length: 24
    description: "Illumina P7 adapter sequence"

# =====================================================================================
# SEQUENCING READ STRUCTURE
# =====================================================================================

read1_info:
  length_cycles: 241
  description: "Read 1 sequences the cDNA region (biological content)"
  sequencing_start_after: ["s5", "ME"]
  expected_primary_content: "cDNA"
  potential_trailing_sequences: 
    - "polyA_or_random_hexamer"
    - "barcode_R1"
    - "linker_R2" 
    - "barcode_R2"
    - "linker_R3"
    - "barcode_R3"
    - "UMI"
    - "TruSeq_Read_2_adapter"
  potential_artifacts:
    - name: "TSO_R1_artifact"
      sequence: "AAGCAGTGGTATCAACGCAGAGTGAATGGG"
      max_length: 31
      description: "Template Switching Oligo found in ~5% of R1 reads"

read2_info:
  length_cycles: 91
  description: "Read 2 sequences cell barcodes and UMI (technical sequences)"
  expected_content_ordered:
    - name: "UMI" 
      bases: "1-10"
      length: 10
      sequence_pattern: "N{10}"
      description: "Unique Molecular Identifier (reverse complement)"
    - name: "barcode_R3"
      bases: "11-18" 
      length: 8
      sequence_pattern: "N{8}"
      description: "Round 3 Barcode (reverse complement)"
    - name: "linker_R3_rc"
      bases: "19-48"
      sequence: "GTGGCCGATGTTTCGCATCGGCGTACGACT"
      length: 30
      description: "Round 3 Linker (reverse complement)"
    - name: "barcode_R2"
      bases: "49-56"
      length: 8
      sequence_pattern: "N{8}"
      description: "Round 2 Barcode (reverse complement)"
    - name: "linker_R2_rc"
      bases: "57-78"
      sequence: "ATCCACGTGCTTGAGACTGTGG"
      length: 22
      description: "Round 2 Linker (reverse complement)"
    - name: "barcode_R1"
      bases: "79-86"
      length: 8
      sequence_pattern: "N{8}"
      description: "Round 1 Barcode (reverse complement)"
    - name: "supplemental_bases_R2_end"
      bases: "87-91"
      length: 5
      sequence_pattern: "N{5}"
      description: "Additional bases from polyT/random hexamer region"


# =====================================================================================
# TRIMMING CONFIGURATION
# =====================================================================================
# Motifs and adapters for read trimming when cDNA is shorter than read length

trimming_motifs:
  - name: "Round2_linker"
    sequence: "CCACAGTCTCAAGCACGTGGAT" # Forward strand sequence
    length: 22
    offset_from_cDNA_end:
      description: "Distance from cDNA 3'-end to start of this linker."
      value_with_15bp_polyA: 23 # 15 (polyA) + 8 (barcode_R1)
      value_with_6bp_hexamer: 14  # 6 (hexamer) + 8 (barcode_R1)
      components_in_between: ["polyA_or_random_hexamer", "barcode_R1"]
  - name: "Round3_linker"
    sequence: "AGTCGTACGCCGATGCGAAACATCGGCCAC" # Forward strand sequence
    length: 30
    offset_from_cDNA_end:
      description: "Distance from cDNA 3'-end to start of this linker."
      value_with_15bp_polyA: 53 # 15 (polyA) + 8 (bcR1) + 22 (linkerR2) + 8 (bcR2)
      value_with_6bp_hexamer: 44  # 6 (hex) + 8 (bcR1) + 22 (linkerR2) + 8 (bcR2)
      components_in_between: ["polyA_or_random_hexamer", "barcode_R1", "linker_R2", "barcode_R2"]
  - name: "TruSeq_Read_2_adapter_start_in_R1" # The start of the TruSeq Read 2 adapter itself
    sequence: "AGATCGGAAGAGCACACGTCTGAACTCCAGTCAC" # Forward strand sequence
    length: 34
    offset_from_cDNA_end:
      description: "Distance from cDNA 3'-end to start of this adapter."
      value_with_15bp_polyA: 101 # 15 (polyA) + 8 (bcR1) + 22 (linkR2) + 8 (bcR2) + 30 (linkR3) + 8 (bcR3) + 10 (UMI)
      value_with_6bp_hexamer: 92   # 6 (hex) + 8 (bcR1) + 22 (linkR2) + 8 (bcR2) + 30 (linkR3) + 8 (bcR3) + 10 (UMI)
      components_in_between: ["polyA_or_random_hexamer", "barcode_R1", "linker_R2", "barcode_R2", "linker_R3", "barcode_R3", "UMI"]

other_key_sequences:
  - name: "TSO_Complete" # Template Switching Oligo
    sequence: "AAGCAGTGGTATCAACGCAGAGTGAATGGG"
    length: 31
    description: "Full TSO sequence."
  - name: "polyA_nominal_tail"
    sequence_pattern: "A{15}"
    description: "Nominal 15bp polyA tail."
  - name: "polyA_detection_pattern_aggressive"
    sequence_pattern: "A{10,}" # Suggested for more aggressive polyA filtering
    description: "Pattern to detect polyA sequences of at least 10 A's."
  # - name: "s5_plus_ME"
  #   sequence: "TCGTCGGCAGCGTCAGATGTGTATAAGAGACAG" # s5 + ME
  #   length: 33
  #   description: "Combined s5 and ME sequence, precedes cDNA in R1."

# Reverse complement sequences for reference (some already used in Read2 section)
reverse_complement_sequences_reference:
    Illumina_P5_rc: "GTGTAGATCTCGGTGGTCGCCGTATCATT"
    spacer_after_P5_rc: "GCGATCTA"
    s5_rc: "GACGCTGCCGACGA"
    ME_rc: "CTGTCTCTTATACACATCT"
    linker_R2_rc: "ATCCACGTGCTTGAGACTGTGG" # Also in read2_info
    linker_R3_rc: "GTGGCCGATGTTTCGCATCGGCGTACGACT" # Also in read2_info
    TruSeq_Read_2_adapter_rc: "GTGACTGGAGTTCAGACGTGTGCTCTTCCGATCT"
    Illumina_P7_rc: "CAAGCAGAAGACGGCATACGAGAT"




  
general_artifacts:
  - name: "PolyG_run"
    sequence_pattern: "G{min_len,}" # e.g. G{10,}
    location_info: "Anywhere, potential Novaseq artifact."
    action: "Identify, potentially trim or filter read."

